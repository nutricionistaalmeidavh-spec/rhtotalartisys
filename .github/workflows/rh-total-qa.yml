name: RH Total QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/domain-core/**'
      - '.github/workflows/rh-total-qa.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: node --test ../../packages/domain-core/index.test.cjs
      - run: npm run build
      - name: Smoke-test Electron and local SQLite
        run: |
          set -e
          data_dir="$(mktemp -d)"
          output=$(RH_TOTAL_SMOKE=1 RH_TOTAL_DATA_DIR="$data_dir" xvfb-run -a node_modules/.bin/electron . 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          grep -q RH_TOTAL_SMOKE_OK <<< "$output"
