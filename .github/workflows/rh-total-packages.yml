name: RH Total Installers
on:
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            command: npx electron-builder --win nsis --x64 --publish never
          - os: macos-15
            label: macOS-arm64
            command: npx electron-builder --mac dmg --arm64 --publish never
    name: 'RH Total Installer (${{ matrix.label }})'
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile frontend
        run: npm run build
      - name: Package unsigned installer
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: RH-Total-ArtiSys-${{ matrix.label }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
